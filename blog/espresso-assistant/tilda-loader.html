<!--
  MBS Espresso Assistant hosted loader.
  Insert this file into a Tilda T123 HTML block after tilda-seo-block.html.
-->
<div id="mbs-espresso-assistant-hosted-root" data-mbs-espresso-assistant-loader>
  <section style="padding:32px 20px;background:#f5f5f5;color:#1f2920;font-family:Mulish,Arial,sans-serif;">
    <div style="max-width:760px;margin:0 auto;padding:24px;border:1px solid #d8e2d5;border-radius:20px;background:#fff;">
      <p style="margin:0 0 8px;color:#417033;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;">Помощник настройки эспрессо</p>
      <div role="heading" aria-level="2" style="margin:0;color:#1f2920;font-size:28px;line-height:1.12;font-weight:900;">Готовим журнал попыток</div>
      <p style="margin:12px 0 0;color:#5b675b;font-size:16px;line-height:1.5;">Дозировка, выход, время и вкус останутся только в вашем браузере.</p>
      <p role="status" style="margin:16px 0 0;color:#417033;font-size:14px;font-weight:800;">Загружаем помощник…</p>
      <noscript><p style="margin:16px 0 0;color:#5b675b;font-size:14px;line-height:1.5;">Для журнала попыток включите JavaScript. Методика и список параметров остаются доступны ниже.</p></noscript>
    </div>
  </section>
</div>

<script>
  (function () {
    var root = document.getElementById('mbs-espresso-assistant-hosted-root');
    if (!root || root.getAttribute('data-loader-ready') === '1') return;
    root.setAttribute('data-loader-ready', '1');

    var slot = document.querySelector('[data-mbs-espresso-assistant-loader-slot]');
    if (slot && slot.parentNode) slot.parentNode.replaceChild(root, slot);

    var HOSTED_URL = 'https://api.barista-school.ru/api/espresso-assistant.html';
    var LOAD_TIMEOUT_MS = 10000;

    function cacheBustedUrl(url) {
      return url + (url.indexOf('?') === -1 ? '?' : '&') + 'v=' + Date.now();
    }

    function fetchWithTimeout(url) {
      var controller = window.AbortController ? new AbortController() : null;
      var timeoutId = null;
      var options = { method: 'GET', credentials: 'omit', cache: 'no-store', headers: { Accept: 'text/html' } };
      if (controller) options.signal = controller.signal;

      return new Promise(function (resolve, reject) {
        timeoutId = window.setTimeout(function () {
          if (controller) controller.abort();
          reject(new Error('Timeout'));
        }, LOAD_TIMEOUT_MS);

        fetch(cacheBustedUrl(url), options)
          .then(function (response) {
            window.clearTimeout(timeoutId);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.text();
          })
          .then(resolve)
          .catch(function (error) {
            window.clearTimeout(timeoutId);
            reject(error);
          });
      });
    }

    function validateHostedHtml(html) {
      if (typeof html !== 'string' || html.length < 12000) throw new Error('Short HTML response');
      if (html.indexOf('data-mbs-espresso-assistant-hosted="v1"') === -1
        || html.indexOf('mbsEspressoAssistant:v1:sessions') === -1) {
        throw new Error('Unexpected HTML response');
      }
      return html;
    }

    function runScripts(container) {
      Array.prototype.slice.call(container.querySelectorAll('script')).forEach(function (oldScript) {
        var script = document.createElement('script');
        Array.prototype.slice.call(oldScript.attributes).forEach(function (attribute) {
          script.setAttribute(attribute.name, attribute.value);
        });
        script.text = oldScript.text || oldScript.textContent || '';
        oldScript.parentNode.replaceChild(script, oldScript);
      });
    }

    function renderError() {
      root.innerHTML = ''
        + '<section style="padding:32px 20px;background:#f5f5f5;color:#1f2920;font-family:Mulish,Arial,sans-serif;text-align:center;">'
        + '<div style="max-width:680px;margin:0 auto;padding:24px;border:1px solid #d8e2d5;border-radius:20px;background:#fff;">'
        + '<p style="margin:0 0 8px;color:#417033;font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;">Помощник настройки эспрессо</p>'
        + '<div role="heading" aria-level="2" style="margin:0;color:#1f2920;font-size:28px;line-height:1.12;font-weight:900;">Помощник временно не загрузился</div>'
        + '<p style="margin:12px 0 8px;color:#5b675b;font-size:16px;line-height:1.5;">Запишите дозировку, выход, время и главное наблюдение о вкусе. Меняйте только один параметр за попытку.</p>'
        + '<p style="margin:0;color:#5b675b;font-size:14px;line-height:1.5;">Для несбалансированного шота: быстрее 25 секунд — помол мельче, медленнее 30 секунд — помол крупнее. Сбалансированный рецепт лучше повторить без изменений.</p>'
        + '<a href="/barista_courses" target="_top" style="display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:18px;padding:0 18px;border-radius:999px;background:#cc2841;color:#fff!important;text-decoration:none;font-size:15px;font-weight:900;">Разобраться на практике</a>'
        + '</div></section>';
    }

    fetchWithTimeout(HOSTED_URL)
      .then(validateHostedHtml)
      .then(function (html) {
        root.innerHTML = html;
        runScripts(root);
      })
      .catch(function (error) {
        console.error('[mbs-espresso-assistant] hosted helper load failed', error);
        renderError();
      });
  }());
</script>
