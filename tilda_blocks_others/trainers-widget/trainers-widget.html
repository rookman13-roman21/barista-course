<!-- ============================================================
  TILDA BLOCK — MBS TRAINERS WIDGET
  Универсальный блок тренеров: public JSON → карточки → popup-профиль
  Данные по умолчанию: https://api.barista-school.ru/api/trainers.json
============================================================ -->

<script>
  if (!window.__phIconsLoaded) {
    window.__phIconsLoaded = true;
    var mbsTrainersIcons = document.createElement('script');
    mbsTrainersIcons.src = 'https://unpkg.com/@phosphor-icons/web@2.1.1';
    document.head.appendChild(mbsTrainersIcons);
  }
</script>

<style>
  .mbs-trainers-widget { font-family:'Mulish',sans-serif; background:#fff; padding:90px 20px; }
  .mbs-trainers-widget * { box-sizing:border-box; }
  .mbs-trainers-widget__wrap { max-width:1100px; margin:0 auto; }
  .mbs-trainers-widget__label { display:inline-flex; align-items:center; gap:7px; margin-bottom:14px; padding:7px 16px; border-radius:999px; background:rgba(231,242,227,.95); color:#417033; font-size:13px; font-weight:900; }
  .mbs-trainers-widget__title { margin:0 0 10px; color:#1F1F1F; font-size:34px; font-weight:900; letter-spacing:-.04em; }
  .mbs-trainers-widget__sub { margin:0 0 44px; color:#555; font-size:16px; font-weight:500; line-height:1.55; }
  .mbs-trainers-widget__grid { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
  .mbs-trainers-widget__state { grid-column:1/-1; padding:28px; border-radius:18px; background:#F5F5F5; color:#555; font-size:15px; font-weight:700; line-height:1.5; text-align:center; }
  .mbs-trw-card { display:flex; flex-direction:column; width:100%; min-height:100%; padding:0; overflow:hidden; border:0; border-radius:20px; background:#F5F5F5; color:#1F1F1F; cursor:pointer; font-family:'Mulish',sans-serif; text-align:left; transition:box-shadow .2s,transform .2s; }
  .mbs-trw-card:hover,.mbs-trw-card:focus-visible { box-shadow:0 10px 36px rgba(31,31,31,.1); transform:translateY(-2px); }
  .mbs-trw-card:focus { outline:none; }
  .mbs-trw-card:focus-visible { outline:3px solid #B6D8AB; outline-offset:3px; }
  .mbs-trw-card__photo { display:flex; align-items:center; justify-content:center; aspect-ratio:3/4; overflow:hidden; background:#E7F2E3; }
  .mbs-trw-card__photo img { display:block; width:100%; height:100%; object-fit:cover; }
  .mbs-trw-card__placeholder { display:grid; width:100%; height:100%; place-items:center; color:#417033; font-size:42px; font-weight:900; }
  .mbs-trw-card__info { display:flex; flex-direction:column; gap:4px; padding:16px 18px 20px; }
  .mbs-trw-card__name { color:#1F1F1F; font-size:15px; font-weight:800; line-height:1.25; }
  .mbs-trw-card__role { color:#4F883E; font-size:12px; font-weight:600; line-height:1.4; }
  .mbs-trw-card__meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; color:#555; font-size:11px; font-weight:800; line-height:1.35; }
  .mbs-trw-card__pill { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:999px; background:#fff; }
  .mbs-trw-card__more { display:inline-flex; align-items:center; gap:6px; width:fit-content; margin-top:10px; color:#417033; font-size:12px; font-weight:900; }
  .mbs-trw-card__more i { font-size:14px; transition:transform .2s; }
  .mbs-trw-card:hover .mbs-trw-card__more i,.mbs-trw-card:focus-visible .mbs-trw-card__more i { transform:translateX(2px); }
  @media (max-width:900px) { .mbs-trainers-widget { padding:64px 14px; } .mbs-trainers-widget__title { font-size:26px; } .mbs-trainers-widget__grid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:520px) { .mbs-trainers-widget__grid { grid-template-columns:repeat(2,1fr); } }
</style>

<section class="mbs-trainers-widget" id="mbs-trainers-widget" data-trainers-api-url="https://api.barista-school.ru/api/trainers.json">
  <div class="mbs-trainers-widget__wrap">
    <div class="mbs-trainers-widget__label"><i class="ph ph-chalkboard-teacher"></i>Тренеры</div>
    <h2 class="mbs-trainers-widget__title">Ваши проводники в мир кофе</h2>
    <p class="mbs-trainers-widget__sub">Практикующие бариста и тренеры MBS проводят занятия на профессиональном оборудовании.</p>
    <div class="mbs-trainers-widget__grid" data-trainers-grid><div class="mbs-trainers-widget__state">Загружаем тренеров...</div></div>
  </div>
</section>

<script src="https://api.barista-school.ru/trainer-profile-widget.js"></script>
<script>
  (function () {
    if (window.__mbsTrainersWidgetInit) return;
    window.__mbsTrainersWidgetInit = true;

    var root = document.getElementById('mbs-trainers-widget');
    if (!root) return;
    var grid = root.querySelector('[data-trainers-grid]');
    var apiUrl = root.getAttribute('data-trainers-api-url') || 'https://api.barista-school.ru/api/trainers.json';
    var trainersById = {};
    var profileModal = window.MBSTrainerProfileModal && window.MBSTrainerProfileModal.create();

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
      });
    }

    function ratingText(value) {
      var rating = Number(value) || 0;
      return rating ? String(Math.round(rating * 10) / 10).replace('.', ',') : '';
    }

    function reviewsText(value) {
      var count = Number(value) || 0;
      if (!count) return 'Нет отзывов';
      var mod10 = count % 10;
      var mod100 = count % 100;
      var word = 'отзывов';
      if (mod10 === 1 && mod100 !== 11) word = 'отзыв';
      else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = 'отзыва';
      return count + ' ' + word;
    }

    function normalizeTrainer(item) {
      return {
        id: String(item.staff_id || item.id || item.name || ''),
        staff_id: item.staff_id || item.id || '',
        name: item.name || 'Тренер MBS',
        position: item.position || 'Тренер MBS',
        photo: item.photo || '',
        bio: item.bio || '',
        rating: Number(item.rating) || 0,
        reviews_count: Number(item.reviews_count) || 0,
        reviews: Array.isArray(item.reviews) ? item.reviews : []
      };
    }

    function photoHtml(trainer) {
      if (trainer.photo) return '<img src="' + esc(trainer.photo) + '" alt="' + esc(trainer.name) + '" loading="lazy">';
      return '<div class="mbs-trw-card__placeholder">' + esc(String(trainer.name || 'Т').charAt(0)) + '</div>';
    }

    function setState(text) {
      grid.innerHTML = '<div class="mbs-trainers-widget__state">' + esc(text) + '</div>';
    }

    function renderCards(trainers) {
      if (!trainers.length) {
        setState('Сейчас нет тренеров для отображения.');
        return;
      }
      grid.innerHTML = trainers.map(function (trainer) {
        var rating = ratingText(trainer.rating);
        return '' +
          '<button class="mbs-trw-card js-mbs-trw-open" type="button" data-trainer-id="' + esc(trainer.id) + '" aria-label="Смотреть профиль: ' + esc(trainer.name) + '">' +
            '<div class="mbs-trw-card__photo">' + photoHtml(trainer) + '</div>' +
            '<div class="mbs-trw-card__info">' +
              '<div class="mbs-trw-card__name">' + esc(trainer.name) + '</div>' +
              '<div class="mbs-trw-card__role">' + esc(trainer.position) + '</div>' +
              '<div class="mbs-trw-card__meta">' +
                (rating ? '<span class="mbs-trw-card__pill"><i class="ph ph-star"></i>' + esc(rating) + '</span>' : '') +
                '<span class="mbs-trw-card__pill"><i class="ph ph-chat-circle-text"></i>' + esc(reviewsText(trainer.reviews_count)) + '</span>' +
              '</div>' +
              '<span class="mbs-trw-card__more">Смотреть профиль <i class="ph ph-arrow-right"></i></span>' +
            '</div>' +
          '</button>';
      }).join('');
    }

    function loadTrainers() {
      var url = new URL(apiUrl, window.location.href);
      url.searchParams.set('_', String(Date.now()));
      fetch(url.toString(), { cache:'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function (data) {
          var trainers = (Array.isArray(data.trainers) ? data.trainers : []).map(normalizeTrainer);
          trainersById = {};
          trainers.forEach(function (trainer) { trainersById[trainer.id] = trainer; });
          renderCards(trainers);
        })
        .catch(function () { setState('Не удалось загрузить тренеров. Попробуйте обновить страницу позже.'); });
    }

    document.addEventListener('click', function (event) {
      var trigger = event.target.closest('.js-mbs-trw-open');
      if (!trigger || !profileModal) return;
      var trainer = trainersById[trigger.getAttribute('data-trainer-id')];
      if (trainer) profileModal.open(trainer, trigger);
    });

    loadTrainers();
  })();
</script>
